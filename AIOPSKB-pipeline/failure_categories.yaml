# failure_categories.yaml
# 故障类别标签库 —— 对齐公司 PHM 监测平台真实故障标签
#
# 数据来源：公司 PHM 数据库 diag_fault_case 故障案例表（fullfaulttypename 字段）
# 采集时间：2026-06
# 对齐方法：故障类别 = fullfaulttypename 层级末段（失效模式），如「润滑不良」「剥落」「点蚀」
#           位置信息（内圈/外圈/滚动体）由知识库「零件」列承载，不进入故障类别
#
# 设计原则：
#   1. 叶子值（categories）严格对齐平台真实标签，LLM 禁止自创
#   2. 分组（groups）按"部件族"组织，服务关键词匹配与故障生成（结构自主设计）
#   3. 分组通过部件/零件名称关键词匹配自动选择（见 config.py select_failure_categories）
#   4. 无匹配时使用"通用"分组（取跨部件通用失效模式）
#   5. 本文件由人工维护，新增标签需在此登记，并核对平台是否已有该标签
#
# 备注：平台故障类别是"跨部件通用的失效模式"（磨损/剥落/断裂…），
#       同一失效模式可出现在多个部件族中，故不同分组的 categories 会有重叠，属正常。

groups:

  滚动轴承:
    description: "滚动轴承类零件：滚动体、保持架、内外圈等（平台故障量最大的部件族）"
    keywords:
      - 滚动轴承
      - 轴承
      - 滚动体
      - 滚子
      - 保持架
      - 内圈
      - 外圈
    categories:
      - 润滑不良
      - 磨损
      - 剥落
      - 点蚀
      - 电腐蚀
      - 定位异常
      - 断裂
      - 跑圈（走圈或蠕动）
      - 游隙不当
      - 压痕
      - 润滑失效
      - 破裂
      - 卡滞
      - 锈蚀
      - 裂纹
      - 铆钉松动

  滑动轴承:
    description: "滑动轴承类零件：轴瓦、石墨轴承、推力瓦、支撑轴瓦、巴氏合金瓦等"
    keywords:
      - 滑动轴承
      - 轴瓦
      - 石墨轴承
      - 支撑轴瓦
      - 推力瓦
      - 巴氏合金
      - 轴套
    categories:
      - 磨损
      - 破裂
      - 间隙不当
      - 润滑不良
      - 定位异常
      - 烧瓦

  齿轮传动:
    description: "齿轮类零件：齿轮、齿轮箱、行星轮、太阳轮、齿圈、内齿圈等"
    keywords:
      - 齿轮
      - 齿轮箱
      - 行星
      - 太阳轮
      - 齿圈
      - 行星轮
      - 啮合
      - 小齿轮
    categories:
      - 断齿
      - 剥落
      - 磨损
      - 点蚀
      - 润滑不良
      - 啮合不良
      - 齿面胶合

  联轴器:
    description: "联轴器类零件：膜片、柱销、梅花垫、弹性体、万向节、尼龙棒、蛇形簧、鼓形齿等"
    keywords:
      - 联轴器
      - 膜片
      - 柱销
      - 梅花垫
      - 弹性体
      - 万向节
      - 尼龙棒
      - 蛇形簧
      - 鼓形齿
    categories:
      - 磨损
      - 不对中
      - 断裂
      - 破裂
      - 裂纹
      - 松动
      - 磨碰
      - 变形

  转子叶轮:
